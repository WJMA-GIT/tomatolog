name: Release Android and iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" -a -n "$STORE_PASSWORD" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android ARM64
        run: |
          flutter pub get
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          build_number="${version#*+}"
          version="${version%%+*}"
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name "$version" \
            --build-number "$build_number"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "tomatolog-v$version-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: tomatolog-*.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Build unsigned iOS IPA
        run: |
          flutter pub get
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          build_number="${version#*+}"
          version="${version%%+*}"
          flutter build ios \
            --release \
            --no-codesign \
            --build-name "$version" \
            --build-number "$build_number"
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "tomatolog-v$version-ios-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: tomatolog-*.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          tag="v${version%%+*}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              --latest
          fi
