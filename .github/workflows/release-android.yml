name: Release Android ARM64

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Calculate version
        id: version
        shell: bash
        run: |
          current_tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)"
          if [[ -n "$current_tag" ]]; then
            version="${current_tag#v}"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ -z "$latest_tag" ]]; then
              version="$(awk '/^version:/{print $2}' pubspec.yaml)"
              version="${version%%+*}"
            else
              IFS=. read -r major minor patch <<< "${latest_tag#v}"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" -a -n "$STORE_PASSWORD" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build ARM64 APK
        run: |
          flutter pub get
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "tomatolog-${{ steps.version.outputs.tag }}-arm64-v8a.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: tomatolog-${{ steps.version.outputs.tag }}-arm64-v8a.apk
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi

      - name: Sync version to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          sed -i "s/^version:.*/version: $VERSION+$GITHUB_RUN_NUMBER/" pubspec.yaml
          git diff --quiet -- pubspec.yaml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
