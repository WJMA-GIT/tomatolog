name: Release iOS to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_IOS_TESTFLIGHT == 'true'
    runs-on: macos-26
    env:
      IOS_BUNDLE_ID: com.mawj.tomatolog
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Check App Store Connect configuration
        env:
          ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          CERTIFICATE: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          test -n "$APPLE_TEAM_ID" -a -n "$ISSUER_ID" -a -n "$API_KEY_ID"
          test -n "$API_PRIVATE_KEY" -a -n "$CERTIFICATE" -a -n "$CERTIFICATE_PASSWORD"

      - name: Test
        run: |
          flutter pub get
          flutter test

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ env.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Configure signing and export
        run: |
          ruby -e '
            path = "ios/Runner.xcodeproj/project.pbxproj"
            text = File.read(path)
            bundle = "PRODUCT_BUNDLE_IDENTIFIER = #{ENV.fetch("IOS_BUNDLE_ID")};"
            abort "Runner bundle identifier was not found" unless text.include?(bundle)
            File.write(path, text.gsub(bundle, "#{bundle}\n\t\t\t\tDEVELOPMENT_TEAM = #{ENV.fetch("APPLE_TEAM_ID")};"))
          '
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

      - name: Build signed IPA
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          version="${version%%+*}"
          flutter build ipa \
            --release \
            --build-name "$version" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Find IPA
        id: ipa
        run: |
          ipa="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          test -n "$ipa"
          echo "path=$ipa" >> "$GITHUB_OUTPUT"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomatolog-ios-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: false
          wait-for-processing: true
